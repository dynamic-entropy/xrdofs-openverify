name: xrdmon-collector release

on:
  push:
    tags:
      - "xrdmon-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for artifact names (e.g. 0.1.0); ignored for tag builds"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/xrdmon-collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: tools/xrdmon-collector/go.mod
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    defaults:
      run:
        working-directory: tools/xrdmon-collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: tools/xrdmon-collector/go.mod

      - name: Version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/xrdmon-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/xrdmon-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          out="xrdmon-collector-${VERSION}-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "${out}" .
          mkdir -p dist
          tar -czf "dist/${out}.tar.gz" "${out}"
          (cd dist && sha256sum "${out}.tar.gz" > "${out}.tar.gz.sha256")
          echo "asset=${out}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: xrdmon-collector-${{ steps.ver.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            tools/xrdmon-collector/dist/*.tar.gz
            tools/xrdmon-collector/dist/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/xrdmon-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: xrdmon-collector-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
